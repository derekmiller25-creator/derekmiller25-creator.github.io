<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift Plan">
<title>Lift Plan · 4-Week Return to Gym</title>
<style>
:root{
  --bg:#0d0f14;--bg2:#151922;--card:#1a1f2b;--card2:#222838;--line:#2c3446;
  --text:#eef1f7;--muted:#9aa4b8;--accent:#c6ff3d;--accent2:#9be000;--accentInk:#0d0f14;
  --warn:#ffb340;--bad:#ff5d5d;--ok:#3ddc84;--radius:18px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif}
body{min-height:100vh;padding-bottom:calc(84px + var(--safe-b))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:rgba(13,15,20,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;height:60px}
.brand{font-weight:900;letter-spacing:.5px;font-size:20px;flex:1;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--accent);box-shadow:0 0 16px var(--accent)}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
h1{font-size:28px;line-height:1.1;margin:22px 0 6px;font-weight:900;letter-spacing:-.5px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin:26px 0 10px;font-weight:800}
.sub{color:var(--muted);margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
.hero{background:linear-gradient(135deg,#202a10 0%,#1a1f2b 60%);border:1px solid #3d4f17;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(198,255,61,.25),transparent 70%)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--card2);color:var(--muted)}
.pill.acc{background:var(--accent);color:var(--accentInk)}
.pill.warn{background:rgba(255,179,64,.15);color:var(--warn)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:16px;font-weight:900;font-size:17px;letter-spacing:.3px;background:var(--accent);color:var(--accentInk);margin-top:14px;box-shadow:0 8px 24px rgba(198,255,61,.18)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card2);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid #4a2630;box-shadow:none}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg button{min-height:58px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:900;font-size:18px;position:relative}
.seg button small{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.4px}
.seg button.on{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.seg button.on small{color:#2b3a06}
.seg button.next:not(.on){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.seg button .dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.daycard{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin:10px 0;width:100%;text-align:left;min-height:76px}
.daycard .ltr{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:22px;background:var(--card2);flex:none}
.daycard.next{border-color:var(--accent)}
.daycard.next .ltr{background:var(--accent);color:var(--accentInk)}
.daycard .meta{flex:1;min-width:0}
.daycard b{display:block;font-size:17px}
.daycard span{color:var(--muted);font-size:14px}
.check{color:var(--ok);font-weight:900}
.kneebox{border-color:#5a4316;background:linear-gradient(135deg,#2a2112,#1a1f2b)}
.kneebox b{color:var(--warn)}
.ex{padding:0;overflow:hidden}
.ex .head{display:flex;gap:12px;padding:16px 16px 10px;align-items:flex-start}
.ex .num{flex:none;width:34px;height:34px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-weight:900;color:var(--accent)}
.ex .title{flex:1;min-width:0}
.ex .title b{font-size:18px;display:block;line-height:1.2}
.ex .rx{font-size:15px;color:var(--text);margin-top:4px;font-weight:700}
.ex .rx em{font-style:normal;color:var(--accent)}
.ex .last{font-size:13px;color:var(--muted);margin-top:2px}
.ex .last b{display:inline;font-size:13px;color:var(--text)}
.ex .fig{display:flex;gap:12px;align-items:center;padding:0 16px}
.ex .fig svg{flex:none;width:112px;height:88px;background:var(--bg2);border-radius:14px;border:1px solid var(--line)}
.ex .fig .tags{display:flex;flex-wrap:wrap;gap:6px}
.howto{margin:10px 16px 0;border-top:1px solid var(--line)}
.howto summary{list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:48px;font-weight:800;cursor:pointer}
.howto summary::-webkit-details-marker{display:none}
.howto summary:after{content:"+";font-size:22px;color:var(--accent)}
.howto[open] summary:after{content:"–"}
.howto ol{margin:0 0 10px;padding-left:22px;color:#d7dce8}
.howto li{margin:4px 0}
.note{margin:8px 0 10px;padding:10px 12px;border-radius:12px;font-size:14px;background:rgba(255,179,64,.1);color:#ffd59a;border:1px solid rgba(255,179,64,.25)}
.note.alt{background:rgba(198,255,61,.07);color:#dff7a8;border-color:rgba(198,255,61,.2)}
.demo{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:12px;background:var(--card2);border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:800;font-size:15px;margin:4px 0 12px}
.demo svg{width:20px;height:20px}
.sets{padding:6px 12px 14px;background:var(--bg2);border-top:1px solid var(--line)}
.setrow{display:grid;grid-template-columns:40px 1fr 1fr 56px;gap:8px;align-items:center;margin-top:8px}
.setrow.cols3{grid-template-columns:40px 1fr 56px}
.setrow.cols2{grid-template-columns:40px 1fr 56px}
.setrow .sn{font-weight:900;color:var(--muted);text-align:center}
.setrow .sn.extra{color:var(--accent)}
.field{position:relative}
.field input{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 40px 0 12px;font-size:18px;font-weight:800;outline:none}
.field input:focus{border-color:var(--accent)}
.field span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);font-weight:700;pointer-events:none}
.tick{width:56px;height:50px;border-radius:12px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center}
.tick svg{width:26px;height:26px;opacity:.25}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick.on svg{opacity:1;stroke:var(--accentInk)}
.setrow.done input{opacity:.7}
.lbl{display:grid;grid-template-columns:40px 1fr 1fr 56px;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:800;margin-top:6px}
.lbl.cols3,.lbl.cols2{grid-template-columns:40px 1fr 56px}
.lbl div{text-align:center}
.wu{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.wu:last-child{border-bottom:0}
.wu .tick{width:44px;height:44px;flex:none}
.wu b{display:block}
.wu span{font-size:13px;color:var(--muted)}
.section-tag{display:flex;align-items:center;gap:10px;margin:28px 0 6px}
.section-tag:after{content:"";flex:1;height:1px;background:var(--line)}
.section-tag span{font-size:12px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent)}
.slider{width:100%;-webkit-appearance:none;appearance:none;height:10px;border-radius:999px;background:linear-gradient(90deg,var(--ok),var(--warn) 35%,var(--bad));outline:none;margin:18px 0 8px}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:#fff;border:4px solid var(--bg);box-shadow:0 2px 10px rgba(0,0,0,.5)}
.slider::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;border:4px solid var(--bg)}
.kneeval{font-size:44px;font-weight:900;line-height:1}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
textarea{width:100%;min-height:80px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font:inherit;padding:12px;outline:none}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(13,15,20,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr);height:68px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:800;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent)}
.timer{position:fixed;left:12px;right:12px;bottom:calc(80px + var(--safe-b));z-index:40;max-width:536px;margin:0 auto;background:#10140a;border:1px solid var(--accent);border-radius:20px;padding:12px 14px;display:none;align-items:center;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.timer.show{display:flex}
.timer .ring{width:58px;height:58px;flex:none;position:relative}
.timer .ring svg{transform:rotate(-90deg)}
.timer .t{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;flex:1}
.timer .t small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.timer .tb{min-width:52px;height:48px;border-radius:12px;background:var(--card2);font-weight:900;font-size:15px}
.timer.done{border-color:var(--ok);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(61,220,132,.25)}}
.hist{padding:14px 16px}
.hist .row1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hist b{font-size:17px}
.hist .m{color:var(--muted);font-size:14px}
.kp{font-weight:900;padding:4px 10px;border-radius:999px;font-size:13px}
table.lw{width:100%;border-collapse:collapse;font-size:15px}
table.lw td{padding:11px 4px;border-bottom:1px solid var(--line)}
table.lw td:last-child{text-align:right;font-weight:800;white-space:nowrap}
table.lw tr:last-child td{border-bottom:0}
.empty{color:var(--muted);text-align:center;padding:26px 10px}
.progress{height:8px;border-radius:999px;background:var(--card2);overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.stickybar{position:sticky;top:60px;z-index:15;background:rgba(13,15,20,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:10px 0;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line)}
.stickybar .r{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:700}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%) translateY(-20px);opacity:0;background:var(--accent);color:var(--accentInk);font-weight:900;padding:12px 18px;border-radius:14px;z-index:60;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.disabled{opacity:.45}
.small{font-size:13px;color:var(--muted)}
</style>
</head>

</div></nav>

function suggested(){
  var done=S.sessions;
  if(!done.length)return {week:1,day:'A'};
  var l=done[done.length-1];var i=ORDER.indexOf(l.day);
  if(i<3)return {week:l.week,day:ORDER[i+1]};
  if(l.week<4)return {week:l.week+1,day:'A'};
  return {week:4,day:'A',complete:true};
}
function isDone(w,d){return S.sessions.some(function(s){return s.week==w&&s.day==d;});}
function lastFor(id){
  for(var i=S.sessions.length-1;i>=0;i--){var s=S.sessions[i];var e=s.ex&&s.ex[id];if(!e)continue;
    var best=null;e.forEach(function(st){var w=parseFloat(st.w);if(st.done&&!isNaN(w)&&(best===null||w>best.w))best={w:w,r:st.r};});
    if(best)return {w:best.w,r:best.r,date:s.date};}
  return null;
}
function lastAny(id){ // time/reps last values
  for(var i=S.sessions.length-1;i>=0;i--){var s=S.sessions[i];var e=s.ex&&s.ex[id];if(!e)continue;
    var d=e.filter(function(x){return x.done&&(x.r||x.w);});if(d.length)return d[d.length-1];}
  return null;
}

    h+='<button class="daycard '+(x==d?'next':'')+'" data-d="'+x+'"><div class="ltr">'+x+'</div><div class="meta"><b>'+esc(DAYS[x].name)+'</b><span>'+esc(DAYS[x].loc)+' · '+(x=='D'?'~45 min':'50–60 min')+(nx?' · <span style="color:var(--accent);font-weight:800">Suggested</span>':'')+'</span></div>'+(dn?'<span class="check">✓</span>':'')+'</button>';});
  h+='<button class="btn" data-go="sel">Open Week '+w+' · Day '+d+'</button>';
  h+='<div class="card kneebox" style="margin-top:22px"><b>Knee rule</b><div style="margin-top:4px">Pain up to <b>3/10</b> is OK <i>if it settles by the next morning</i>. If it goes above 3/10, or is still sore the next morning, <b>halve the depth or weight</b> of that exercise next time.</div><div class="small" style="margin-top:8px">No running, jumping, or pivoting for now. If the knee locks, catches, gives way, or swells, get it checked by a physio or doctor.</div></div>';
  $('#app').innerHTML=h;
  $('#wkseg').onclick=function(e){var b=e.target.closest('button');if(!b)return;S.sel.week=+b.dataset.w;save();renderHome();};
  document.querySelectorAll('.daycard').forEach(function(b){b.onclick=function(){S.sel.day=b.dataset.d;save();renderHome();};});
  document.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){
    var g=b.dataset.go;
    if(g==='draft'){setTab('session');return;}
    var t=g==='sug'?sug:S.sel;openSession(t.week,t.day);};});
}

/* ---------- Session ---------- */
function itemsFor(week,day){ // flat list of {id,sets,reps,kind,section}
  var D=DAYS[day],out=[];
  if(D.main.length){D.main.forEach(function(m,i){out.push({id:m.id,sets:setsFor(week,i),reps:m.reps,sec:'Main work',extra:(week==4&&i<2)});});
    D.fin.forEach(function(f){out.push({id:f.id,sets:f.sets,reps:f.reps,sec:'Finish · knee & mobility',fixed:true});});}
  else D.blocks.forEach(function(b){b.items.forEach(function(f){out.push({id:f.id,sets:f.sets,reps:f.reps,sec:b.title,fixed:true});});});
  return out;
}
function openSession(week,day){
  if(S.draft&&!(S.draft.week==week&&S.draft.day==day)){
    if(!confirm('You have an unfinished Week '+S.draft.week+' · Day '+S.draft.day+' workout. Discard it and start Week '+week+' · Day '+day+'?')){setTab('session');return;}
  }
  if(!S.draft||S.draft.week!=week||S.draft.day!=day){
    var ex={};itemsFor(week,day).forEach(function(it){ex[it.id]=[];for(var i=0;i<it.sets;i++)ex[it.id].push({w:'',r:'',done:false});});
    S.draft={week:week,day:day,start:new Date().toISOString(),ex:ex,warm:{},knee:0,notes:''};
  }
  save();setTab('session');
}
function renderSession(){
  var dr=S.draft;
  if(!dr){$('#hdr').textContent='WORKOUT';$('#hdrPill').textContent='';$('#hdrPill').className='pill';
    var sug=suggested();
    $('#app').innerHTML='<div class="empty" style="padding-top:60px"><div style="font-size:48px">🏋️</div><h1 style="font-size:22px">No workout in progress</h1><p>Your next session is Week '+sug.week+' · Day '+sug.day+'.</p></div><button class="btn" id="startSug">Start Week '+sug.week+' · Day '+sug.day+'</button>';
    $('#startSug').onclick=function(){openSession(sug.week,sug.day);};return;}
  var D=DAYS[dr.day],W=WEEKS[dr.week];
  $('#hdr').textContent='DAY '+dr.day;$('#hdrPill').textContent='Week '+dr.week;$('#hdrPill').className='pill acc';
  var items=itemsFor(dr.week,dr.day);
  var h='<div class="stickybar"><div class="r"><span id="progTxt"></span><span id="elapsed"></span></div><div class="progress"><i id="progBar"></i></div></div>';
  h+='<h1>'+esc(D.name)+'</h1><p class="sub">'+esc(D.loc)+' · '+(dr.day=='D'?'Steady pace, no failure sets.':esc(W.rir)+' · rest ~90 s')+'</p>';
  if(dr.day!='D')h+='<div class="card" style="padding:12px 14px"><span class="pill acc">Week '+dr.week+'</span> <span class="small" style="margin-left:6px">'+esc(W.tip)+'</span></div>';
  if(D.warm){
    h+='<div class="section-tag"><span>Warm-up · 8 min</span></div><div class="card" style="padding:4px 16px">';
    WARMUP.forEach(function(wu){var on=!!dr.warm[wu.id];
      h+='<button class="wu" data-wu="'+wu.id+'"><span class="tick '+(on?'on':'')+'">'+CHECK+'</span><div style="flex:1"><b>'+esc(EX[wu.id].n)+'</b><span>'+esc(wu.rx)+'</span></div><a class="small" href="'+yt(EX[wu.id].q)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">Demo ↗</a></button>';});
    h+='</div>';
  }
  var sec='',n=0;
  items.forEach(function(it){
    if(it.sec!==sec){sec=it.sec;h+='<div class="section-tag"><span>'+esc(sec)+'</span></div>';}
    n++;h+=exCard(it,n,dr);
  });
  h+='<div class="section-tag"><span>Wrap up</span></div>';
  h+='<div class="card"><b>Knee pain today (right knee)</b><div class="small">Worst pain felt during the session.</div>';
  h+='<div style="display:flex;align-items:flex-end;gap:10px;margin-top:10px"><span class="kneeval" id="kv" style="color:'+kneeColor(dr.knee)+'">'+dr.knee+'</span><span class="small" style="padding-bottom:6px">/ 10</span><span id="kmsg" class="small" style="margin-left:auto;padding-bottom:6px;text-align:right;max-width:60%"></span></div>';
  h+='<input type="range" min="0" max="10" step="1" value="'+dr.knee+'" class="slider" id="knee" aria-label="Knee pain 0 to 10"><div class="ticks"><span>0 none</span><span>3 OK</span><span>10 worst</span></div></div>';
  h+='<div class="card"><b>Notes</b><textarea id="notes" placeholder="How did it feel? Anything to change next time?">'+esc(dr.notes)+'</textarea></div>';
  h+='<button class="btn" id="finish">Finish workout</button><button class="btn danger" id="discard">Discard workout</button><div style="height:20px"></div>';
  $('#app').innerHTML=h;
  bindSession(items);
}
function yt(q){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(q);}
function exCard(it,n,dr){
  var e=EX[it.id],week=dr.week,disabled=e.startWeek&&week<e.startWeek;
  var lf=e.log==='wr'?lastFor(it.id):null,la=(e.log==='r'||e.log==='t')?lastAny(it.id):null;
  var unit=e.log==='t'?(e.tUnit||'sec'):'reps';
  var h='<div class="card ex'+(disabled?' disabled':'')+'" id="ex-'+it.id+'"><div class="head"><div class="num">'+n+'</div><div class="title"><b>'+esc(e.n)+'</b>';
  h+='<div class="rx"><em>'+it.sets+' ×</em> '+esc(it.reps)+(it.extra?' <span class="pill acc" style="font-size:10px;padding:3px 7px">+1 set wk 4</span>':'')+'</div>';
  if(lf)h+='<div class="last">Last time: <b>'+lf.w+' '+esc(e.wUnit||'lb')+'</b>'+(lf.r?' × '+esc(lf.r):'')+' · '+fmtDate(lf.date)+'</div>';
  else if(la)h+='<div class="last">Last time: <b>'+esc(la.r||la.w)+' '+unit+'</b></div>';
  else if(e.log==='wr')h+='<div class="last">Last time: no log yet</div>';
  h+='</div></div>';
  h+='<div class="fig">'+fig(e.fig)+'<div class="tags">';
  if(!it.fixed&&week)h+='<span class="pill">'+esc(WEEKS[week].rir.replace('Leave ','').replace(' in the tank',' in reserve'))+'</span>';
  if(e.knee)h+='<span class="pill warn">Knee cue</span>';
  h+='<span class="pill">Rest 90 s</span></div></div>';
  if(disabled)h+='<div class="note alt" style="margin:12px 16px">Starts in Week 2. Skip this week.</div>';
  h+='<details class="howto"'+(n===1?' open':'')+'><summary>How to do it</summary><ol>'+e.cues.map(function(c){return '<li>'+esc(c)+'</li>';}).join('')+'</ol>';
  if(e.knee)h+='<div class="note">⚠︎ '+esc(K+e.knee)+'</div>';
  if(e.alt)h+='<div class="note alt">'+esc(e.alt)+'</div>';
  h+='<a class="demo" href="'+yt(e.q)+'" target="_blank" rel="noopener">'+YT+' Watch demo</a></details>';
  if(!disabled){
    var sets=dr.ex[it.id]||[];var cols=e.log==='wr'?'':(e.log==='none'?' cols2':' cols3');
    h+='<div class="sets">';
    if(e.log==='wr')h+='<div class="lbl"><div>Set</div><div>'+esc(e.wUnit||'lb')+'</div><div>Reps</div><div>Done</div></div>';
    else if(e.log!=='none')h+='<div class="lbl cols3"><div>Set</div><div>'+(e.log==='t'?(e.tUnit||'Seconds'):'Reps')+'</div><div>Done</div></div>';
    sets.forEach(function(s,i){
      var extra=it.extra&&i===3;
      h+='<div class="setrow'+cols+(s.done?' done':'')+'" data-ex="'+it.id+'" data-i="'+i+'"><div class="sn'+(extra?' extra':'')+'">'+(i+1)+'</div>';
      if(e.log==='wr'){h+='<div class="field"><input inputmode="decimal" data-k="w" value="'+esc(s.w)+'" placeholder="'+(lf?lf.w:'–')+'" aria-label="Weight"><span>lb</span></div>';
        h+='<div class="field"><input inputmode="numeric" data-k="r" value="'+esc(s.r)+'" placeholder="'+esc(it.reps.split(' ')[0])+'" aria-label="Reps"><span>reps</span></div>';}
      else if(e.log==='r'||e.log==='t'){h+='<div class="field"><input inputmode="numeric" data-k="r" value="'+esc(s.r)+'" placeholder="'+esc(it.reps.split(' ')[0])+'" aria-label="'+unit+'"><span>'+(e.log==='t'?(e.tUnit||'sec'):'reps')+'</span></div>';}
      else h+='<div class="small" style="padding-left:4px">'+esc(it.reps)+'</div>';
      h+='<button class="tick'+(s.done?' on':'')+'" data-tick aria-label="Mark set '+(i+1)+' done">'+CHECK+'</button></div>';
    });
    h+='</div>';
  }
  return h+'</div>';
}
function updateProgress(items){
  var dr=S.draft,tot=0,dn=0;
  items.forEach(function(it){var e=EX[it.id];if(e.startWeek&&dr.week<e.startWeek)return;(dr.ex[it.id]||[]).forEach(function(s){tot++;if(s.done)dn++;});});
  var p=tot?Math.round(dn/tot*100):0;var b=$('#progBar');if(b)b.style.width=p+'%';
  var t=$('#progTxt');if(t)t.textContent=dn+' / '+tot+' sets done';
}
function tickElapsed(){var el=$('#elapsed');if(!el||!S.draft)return;var m=Math.floor((Date.now()-new Date(S.draft.start))/60000);el.textContent=m+' min';}
setInterval(tickElapsed,15000);
function kneeMsg(v){return v<=3?'Within the rule. Fine if it settles by morning.':'Above 3/10: halve depth/weight on what caused it next time.';}
function bindSession(items){
  var dr=S.draft;updateProgress(items);tickElapsed();
  document.querySelectorAll('[data-wu]').forEach(function(b){b.onclick=function(){var id=b.dataset.wu;dr.warm[id]=!dr.warm[id];b.querySelector('.tick').classList.toggle('on',dr.warm[id]);save();};});
  $('#app').addEventListener('input',function(e){
    var inp=e.target;
    if(inp.dataset.k){var row=inp.closest('.setrow');dr.ex[row.dataset.ex][+row.dataset.i][inp.dataset.k]=inp.value.trim();save();}
  });
  $('#app').addEventListener('click',function(e){
    var b=e.target.closest('[data-tick]');if(!b)return;
    var row=b.closest('.setrow'),id=row.dataset.ex,i=+row.dataset.i,s=dr.ex[id][i];
    s.done=!s.done;
    if(s.done){ // auto-fill from placeholder if blank
      row.querySelectorAll('input').forEach(function(inp){if(!inp.value&&inp.placeholder&&inp.placeholder!=='–'&&/^[\d.]+$/.test(inp.placeholder)){inp.value=inp.placeholder;s[inp.dataset.k]=inp.value;}});
      startTimer(90,EX[id].n);
    }
    b.classList.toggle('on',s.done);row.classList.toggle('done',s.done);save();updateProgress(items);
    if(navigator.vibrate)navigator.vibrate(15);
  });
  var kn=$('#knee'),kv=$('#kv'),km=$('#kmsg');km.textContent=kneeMsg(dr.knee);
  kn.oninput=function(){dr.knee=+kn.value;kv.textContent=dr.knee;kv.style.color=kneeColor(dr.knee);km.textContent=kneeMsg(dr.knee);save();};
  $('#notes').oninput=function(){dr.notes=this.value;save();};
  $('#finish').onclick=function(){
    var any=Object.keys(dr.ex).some(function(k){return dr.ex[k].some(function(s){return s.done;});});
    if(!any&&!confirm('No sets are checked off yet. Save anyway?'))return;
    var ex={};Object.keys(dr.ex).forEach(function(k){ex[k]=dr.ex[k].map(function(s){return {w:s.w,r:s.r,done:s.done};});});
    S.sessions.push({date:new Date().toISOString(),week:dr.week,day:dr.day,knee:dr.knee,notes:dr.notes,mins:Math.max(1,Math.round((Date.now()-new Date(dr.start))/60000)),ex:ex});
    S.draft=null;var sg=suggested();S.sel={week:sg.week,day:sg.day};save();stopTimer();
    toast('Workout saved 💪');setTab('history');
  };
  $('#discard').onclick=function(){if(confirm('Discard this workout? Nothing will be saved.')){S.draft=null;save();stopTimer();setTab('home');}};
}

/* ---------- Rest timer ---------- */
var T={end:0,dur:90,iv:null,ac:null};
function beep(){try{T.ac=T.ac||new (window.AudioContext||window.webkitAudioContext)();var a=T.ac;[0,.25,.5].forEach(function(o){var g=a.createGain(),os=a.createOscillator();os.frequency.value=880;os.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.0001,a.currentTime+o);g.gain.exponentialRampToValueAtTime(.3,a.currentTime+o+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+o+.18);os.start(a.currentTime+o);os.stop(a.currentTime+o+.2);});}catch(e){}}
function startTimer(sec,label){
  try{T.ac=T.ac||new (window.AudioContext||window.webkitAudioContext)();if(T.ac.state==='suspended')T.ac.resume();}catch(e){}
  T.dur=sec;T.end=Date.now()+sec*1000;$('#timerLbl').textContent='Rest · '+label;
  var el=$('#timer');el.classList.add('show');el.classList.remove('done');clearInterval(T.iv);T.iv=setInterval(tickT,250);tickT();
}
function tickT(){
  var left=Math.max(0,Math.ceil((T.end-Date.now())/1000));
  $('#timerTxt').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  $('#ringArc').setAttribute('stroke-dashoffset',String(157.08*(1-left/Math.max(1,T.dur))));
  if(left<=0){clearInterval(T.iv);T.iv=null;var el=$('#timer');el.classList.add('done');$('#timerTxt').textContent='Go!';$('#timerLbl').textContent='Rest over · next set';beep();if(navigator.vibrate)navigator.vibrate([200,100,200]);setTimeout(function(){if(!T.iv)el.classList.remove('show');},6000);}
}
function stopTimer(){clearInterval(T.iv);T.iv=null;$('#timer').classList.remove('show','done');}
$('#tSkip').onclick=stopTimer;
$('#tPlus').onclick=function(){if(!T.iv)return;T.end+=15000;T.dur+=15;tickT();};
$('#tMinus').onclick=function(){if(!T.iv)return;T.end-=15000;tickT();};

/* ---------- History ---------- */
function renderHistory(){
  $('#hdr').textContent='HISTORY';$('#hdrPill').textContent=S.sessions.length+' logged';$('#hdrPill').className='pill';
  var h='<h1>History</h1>';
  if(!S.sessions.length){h+='<div class="card empty">No workouts saved yet.<br>Finish a session and it shows up here.</div>';}
  else{
    var ks=S.sessions.map(function(s){return s.knee;}),avg=(ks.reduce(function(a,b){return a+b;},0)/ks.length).toFixed(1);
    h+='<div class="card" style="display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px"><div><div style="font-size:26px;font-weight:900">'+S.sessions.length+'</div><div class="small">sessions</div></div><div><div style="font-size:26px;font-weight:900">'+streakWeeks()+'</div><div class="small">this week</div></div><div><div style="font-size:26px;font-weight:900;color:'+kneeColor(+avg)+'">'+avg+'</div><div class="small">avg knee</div></div></div>';
    h+='<h2>Last weight used</h2><div class="card" style="padding:4px 16px"><table class="lw">';
    var rows=0;Object.keys(EX).forEach(function(id){if(EX[id].log!=='wr')return;var l=lastFor(id);if(!l)return;rows++;h+='<tr><td>'+esc(EX[id].n)+'<div class="small">'+fmtDate(l.date)+'</div></td><td>'+l.w+' '+esc(EX[id].wUnit||'lb')+(l.r?' × '+esc(l.r):'')+'</td></tr>';});
    if(!rows)h+='<tr><td class="small">No weights logged yet</td><td></td></tr>';
    h+='</table></div><h2>Sessions</h2>';
    S.sessions.slice().reverse().forEach(function(s,ri){
      var idx=S.sessions.length-1-ri,tot=0,dn=0;Object.keys(s.ex||{}).forEach(function(k){s.ex[k].forEach(function(x){tot++;if(x.done)dn++;});});
      h+='<div class="card hist"><div class="row1"><div><b>Week '+s.week+' · Day '+s.day+'</b><div class="m">'+fmtDate(s.date)+' · '+new Date(s.date).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})+' · '+s.mins+' min · '+dn+'/'+tot+' sets</div></div><span class="kp" style="background:'+kneeColor(s.knee)+'22;color:'+kneeColor(s.knee)+'">Knee '+s.knee+'/10</span></div>';
      var lines=[];Object.keys(s.ex||{}).forEach(function(k){var e=EX[k];if(!e)return;var d=s.ex[k].filter(function(x){return x.done;});if(!d.length)return;
        if(e.log==='wr')lines.push(esc(e.n)+': '+d.map(function(x){return (x.w||'BW')+'×'+(x.r||'?');}).join(', '));
        else if(e.log==='r'||e.log==='t')lines.push(esc(e.n)+': '+d.map(function(x){return x.r||'✓';}).join(', '));});
      if(lines.length)h+='<details class="howto" style="margin:10px 0 0"><summary>Details</summary><div class="small" style="line-height:1.7;padding-bottom:8px">'+lines.join('<br>')+'</div></details>';
      if(s.notes)h+='<div class="small" style="margin-top:8px">📝 '+esc(s.notes)+'</div>';
      h+='<button class="small" data-del="'+idx+'" style="margin-top:8px;min-height:36px;color:var(--bad)">Delete</button></div>';
    });
  }
  h+='<h2>Data</h2><div class="card"><div class="small">Your data is stored only in this browser on this phone. Export a backup now and then.</div><button class="btn ghost" id="exp">Export backup (copy JSON)</button><button class="btn ghost" id="imp">Import backup</button></div>';
  $('#app').innerHTML=h;
  document.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){if(confirm('Delete this session?')){S.sessions.splice(+b.dataset.del,1);save();renderHistory();}};});
  $('#exp').onclick=function(){var j=JSON.stringify({sessions:S.sessions});if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(j).then(function(){toast('Backup copied');},function(){prompt('Copy this backup:',j);});}else prompt('Copy this backup:',j);};
  $('#imp').onclick=function(){var j=prompt('Paste backup JSON:');if(!j)return;try{var o=JSON.parse(j);if(!Array.isArray(o.sessions))throw 0;S.sessions=o.sessions;save();toast('Backup restored');renderHistory();}catch(e){alert('That doesn\'t look like a valid backup.');}};
}
function streakWeeks(){var now=new Date(),day=(now.getDay()+6)%7,mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-day);return S.sessions.filter(function(s){return new Date(s.date)>=mon;}).length;}

if(S.draft)tab='session';
setTab(tab);
})();
</script>
</body>
